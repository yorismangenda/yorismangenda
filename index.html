<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="The personal website of Yoris Mangenda, researcher, writer, and cultural documentarian working on architecture and cultural heritage in Borneo."
  >

  <meta name="theme-color" content="#FFFFFF">

  <title>Yoris Mangenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #FFFFFF;
      --text-primary: #171717;
      --text-secondary: #858585;
      --text-hover: #000000;
      --font-main: "Inter", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      color: var(--text-primary);
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-width: 0;
      background: var(--background);
    }

    .homepage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: clip;
      background: var(--background);
    }

    /* Name */

    .site-name {
      position: absolute;
      top: 28px;
      left: 5.13%;
      z-index: 2;
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.55px;
    }

    .site-name a {
      color: var(--text-primary);
      text-decoration: none;
    }

    /* Main navigation */

    .main-navigation {
      position: absolute;
      top: 50%;
      right: 10.26%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .main-navigation a {
      display: block;
      color: var(--text-secondary);
      font-size: 29px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: -0.8px;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .main-navigation a:hover,
    .main-navigation a:focus-visible {
      color: var(--text-hover);
    }

    .main-navigation a:focus-visible,
    .site-name a:focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 4px;
    }

    /* Copyright */

    .copyright {
      position: absolute;
      left: 4%;
      bottom: 20px;
      margin: 0;
      color: #666666;
      font-size: 9px;
      line-height: 1.5;
      font-weight: 400;
    }

    /* Desktop */

    @media (min-width: 768px) {
      .site-name {
        top: 32px;
        left: 5.2%;
        font-size: 21px;
      }

      .main-navigation {
        right: 8%;
        gap: 2px;
      }

      .main-navigation a {
        font-size: clamp(30px, 3vw, 48px);
        line-height: 1.35;
        letter-spacing: -1.2px;
      }

      .copyright {
        left: 5.2%;
        bottom: 24px;
        font-size: 10px;
      }
    }

    /* Short screens */

    @media (max-height: 600px) {
      .site-name {
        top: 18px;
      }

      .main-navigation {
        top: 48%;
        gap: 0;
      }

      .main-navigation a {
        font-size: clamp(23px, 5vh, 29px);
        line-height: 1.35;
      }

      .copyright {
        bottom: 10px;
      }
    }

    /* Respect reduced-motion preferences */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="homepage">

    <header>
      <h1 class="site-name">
        <a href="./" aria-label="Yoris Mangenda — Home">
          Yoris Mangenda
        </a>
      </h1>
    </header>

    <nav class="main-navigation" aria-label="Main navigation">
      <a href="./publications.html">publications</a>
      <a href="./activities.html">activities</a>
      <a href="./about.html">about</a>
      <a href="./contacts.html">contacts</a>
    </nav>

    <footer>
      <p class="copyright">
        © 2026 Yoris Mangenda
      </p>
    </footer>

  </main>
</body>
</html>
