<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yoris Mangenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #ffffff;
      --active: #171717;
      --inactive: #858585;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .homepage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      background: var(--background);
    }

    .site-name {
      position: absolute;
      top: 28px;
      left: 5.13%;
      margin: 0;
      font-size: 19px;
      font-weight: 500;
      color: var(--active);
    }

    .menu-window {
      position: absolute;
      top: 50%;
      right: 10.26%;
      transform: translateY(-50%);
      height: 190px;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: transform 350ms ease;
      will-change: transform;
    }

    .menu-item {
      display: block;
      height: 41px;
      line-height: 41px;
      font-size: 29px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--inactive);
      cursor: pointer;
      transition: color 250ms ease;
    }

    .menu-item.active {
      color: var(--active);
    }

    .copyright {
      position: absolute;
      left: 5.13%;
      bottom: 20px;
      margin: 0;
      font-size: 9px;
      color: #666666;
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-list,
      .menu-item {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="homepage">

    <h1 class="site-name">Yoris Mangenda</h1>

    <nav class="menu-window" aria-label="Main navigation">
      <div class="menu-list" id="menuList">

        <div class="menu-item" data-name="activities">
          activities
        </div>

        <div class="menu-item active" data-name="publications">
          publications
        </div>

        <div class="menu-item" data-name="about">
          about
        </div>

        <div class="menu-item" data-name="contacts">
          contacts
        </div>

      </div>
    </nav>

    <p class="copyright">
      © Yoris Mangenda 2026
    </p>

  </main>
