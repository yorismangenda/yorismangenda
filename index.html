<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Yoris Mangenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #ffffff;
      --active: #171717;
      --inactive: #858585;
      --copyright: #666666;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--background);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .homepage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 400px;
      overflow: hidden;
      background: var(--background);
    }

    .site-name {
      position: absolute;
      top: 28px;
      left: 5.13%;
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--active);
    }

    /* Menu container */

    .menu-window {
      position: absolute;
      right: 10.26%;
      bottom: 105px;

      width: max-content;
      height: 176px;

      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: max-content;

      transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .menu-item {
      display: block;
      flex: 0 0 42px;

      width: max-content;
      height: 42px;
      padding: 0;
      margin: 0;
      border: 0;

      background: transparent;
      color: var(--inactive);

      font-family: inherit;
      font-size: 27px;
      line-height: 42px;
      font-weight: 600;
      letter-spacing: -0.045em;
      text-align: left;
      white-space: nowrap;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      transition: color 300ms ease;
    }

    .menu-item.active {
      color: var(--active);
    }

    .menu-item:focus-visible {
      outline: 1px solid var(--active);
      outline-offset: 3px;
    }

    .copyright {
      position: absolute;
      left: 5.13%;
      bottom: 20px;
      margin: 0;

      color: var(--copyright);
      font-size: 10px;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    @media (max-height: 600px) {
      .menu-window {
        bottom: 75px;
        height: 164px;
      }

      .menu-item {
        flex-basis: 39px;
        height: 39px;
        line-height: 39px;
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-list,
      .menu-item {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="homepage">

    <h1 class="site-name">Yoris Mangenda</h1>

    <nav class="menu-window" id="menuWindow" aria-label="Main navigation">
      <div class="menu-list" id="menuList">

        <button class="menu-item" type="button" data-name="activities">
          activities
        </button>

        <button class="menu-item active" type="button" data-name="publications">
          publications
        </button>

        <button class="menu-item" type="button" data-name="about">
          about
        </button>

        <button class="menu-item" type="button" data-name="contacts">
          contacts
        </button>

      </div>
    </nav>

    <p class="copyright">© Yoris Mangenda 2026</p>

  </main>

  <script>
    const menuWindow = document.getElementById("menuWindow");
    const menuList = document.getElementById("menuList");
    const menuItems = [...document.querySelectorAll(".menu-item")];

    const activeSequence = [
      "publications",
      "activities",
      "about",
      "contacts"
    ];

    let activeIndex = 0;
    let startX = 0;
    let startY = 0;
    let lastWheelTime = 0;

    const SWIPE_THRESHOLD = 30;
    const WHEEL_DELAY = 450;

    function updateMenu() {
      const activeName = activeSequence[activeIndex];
      const activeItem = menuItems.find(
        item => item.dataset.name === activeName
      );

      if (!activeItem) return;

      menuItems.forEach(item => {
        const isActive = item.dataset.name === activeName;
        item.classList.toggle("active", isActive);
        item.setAttribute("aria-current", isActive ? "true" : "false");
      });

      /*
        Center the active item inside the clipping window.
        A small safety margin keeps the full letters visible.
      */

      const windowHeight = menuWindow.clientHeight;
      const itemTop = activeItem.offsetTop;
      const itemHeight = activeItem.offsetHeight;

      let offset = windowHeight / 2 - itemTop - itemHeight / 2;

      const listHeight = menuList.scrollHeight;
      const minOffset = windowHeight - listHeight;
      const maxOffset = 0;

      offset = Math.max(minOffset, Math.min(maxOffset, offset));

      menuList.style.transform = `translateY(${offset}px)`;
    }

    function moveMenu(direction) {
      const nextIndex = activeIndex + direction;

      if (nextIndex < 0 || nextIndex >= activeSequence.length) {
        return;
      }

      activeIndex = nextIndex;
      updateMenu();
    }

    menuItems.forEach(item => {
      item.addEventListener("click", () => {
        const index = activeSequence.indexOf(item.dataset.name);

        if (index !== -1) {
          activeIndex = index;
          updateMenu();
        }
      });
    });

    menuWindow.addEventListener("touchstart", event => {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });

    menuWindow.addEventListener("touchend", event => {
      const deltaX = event.changedTouches[0].clientX - startX;
      const deltaY = event.changedTouches[0].clientY - startY;

      if (
        Math.abs(deltaY) >= SWIPE_THRESHOLD &&
        Math.abs(deltaY) > Math.abs(deltaX)
      ) {
        moveMenu(deltaY < 0 ? 1 : -1);
      }
    }, { passive: true });

    menuWindow.addEventListener("wheel", event => {
      if (Math.abs(event.deltaY) < 10) return;

      event.preventDefault();

      const now = Date.now();

      if (now - lastWheelTime < WHEEL_DELAY) return;

      lastWheelTime = now;
      moveMenu(event.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        moveMenu(1);
      }

      if (event.key === "ArrowUp") {
        moveMenu(-1);
      }
    });

    window.addEventListener("resize", updateMenu);

    updateMenu();
  </script>
</body>
</html>
