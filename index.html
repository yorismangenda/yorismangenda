<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Yoris Mangenda</title>

  <meta
    name="description"
    content="The personal website and portfolio of Yoris Mangenda, documenting architecture, cultural heritage, and life in Borneo."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #ffffff;
      --active: #111111;
      --inactive: #969696;
      --copyright: #555555;
      --page-padding: 44px;
      --menu-size: 40px;
      --menu-line-height: 1.12;
      --menu-gap: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--active);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HOMEPAGE */

    .homepage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
    }

    /* SITE NAME */

    .site-name {
      position: absolute;
      top: 20px;
      left: 5.13%;
      margin: 0;

      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.035em;

      color: var(--active);
    }

    /* MAIN NAVIGATION */

    .main-navigation {
      position: fixed;
      right: 5.13%;
      bottom: 7.5%;

      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--menu-gap);
    }

    .main-navigation a {
      display: block;

      color: var(--inactive);

      font-size: var(--menu-size);
      line-height: var(--menu-line-height);
      font-weight: 700;
      letter-spacing: -0.045em;

      white-space: nowrap;

      transition: color 200ms ease;
    }

    .main-navigation a:hover,
    .main-navigation a.active {
      color: var(--active);
    }

    .main-navigation a:focus-visible {
      outline: 1px solid var(--active);
      outline-offset: 4px;
    }

    /* COPYRIGHT */

    .copyright {
      position: absolute;
      left: 5.13%;
      bottom: 20px;

      margin: 0;

      color: var(--copyright);
      font-size: 10px;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    /* SHORT DESKTOP SCREENS */

    @media (min-width: 761px) and (max-height: 650px) {
      :root {
        --menu-size: 30px;
        --menu-gap: 5px;
      }

      .main-navigation {
        bottom: 5%;
      }
    }

    /* MOBILE */

    @media (max-width: 760px) {
      :root {
        --page-padding: 18px;
        --menu-size: 34px;
        --menu-gap: 8px;
      }

      .site-name {
        top: 20px;
        left: 18px;
        font-size: 14px;
      }

      .main-navigation {
        right: 18px;
        bottom: 7%;
      }

      .copyright {
        left: 18px;
        bottom: 18px;
        font-size: 9px;
      }
    }

    /* SMALL MOBILE SCREENS */

    @media (max-width: 360px) {
      :root {
        --menu-size: 30px;
        --menu-gap: 7px;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="homepage">

    <!-- SITE NAME -->

    <a class="site-name" href="./index.html">
      Yoris Mangenda
    </a>


    <!-- MAIN NAVIGATION -->

    <nav class="main-navigation" aria-label="Main navigation">

      <a href="./activities.html">
        activities
      </a>

      <a href="./books.html" class="active" aria-current="page">
        publications
      </a>

      <a href="./about.html">
        about
      </a>

      <a href="./contacts.html">
        contacts
      </a>

    </nav>


    <!-- COPYRIGHT -->

    <p class="copyright">
      © Yoris Mangenda 2026
    </p>

  </main>

</body>

</html>
